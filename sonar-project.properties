sonar.projectKey=edital-radar
sonar.projectName=edital-radar
sonar.sourceEncoding=UTF-8

# The whole repository, not just the Python packages. Dockerfile, the compose
# file and the CI workflow are where misconfiguration lives — analysing only
# app/ and evals/ would leave the infrastructure unchecked while reporting a
# green gate.
# Both roots are the repository, made disjoint by the patterns below rather
# than by pointing at different directories. Two failure modes this avoids:
# `sonar.sources=app,evals` skipped the Dockerfile and compose entirely, and
# putting `tests/**` in sonar.exclusions dropped the whole suite from indexing
# instead of only from the source set — both left the gate green over code
# nobody had read.
sonar.sources=.
sonar.tests=.

sonar.exclusions=.venv/**,.claude/**,data/**,htmlcov/**,.scannerwork/**,**/*.egg-info/**,tests/**
sonar.test.inclusions=tests/**
sonar.test.exclusions=.venv/**,.claude/**

sonar.python.version=3.12

# Cobertura-format report, produced by `pytest --cov --cov-report=xml`.
# Needs source_pkgs (not source) in pyproject.toml, otherwise the paths come
# out as `agente.py` instead of `app/agente.py` and Sonar resolves none of
# them — reporting 0% coverage for a reason unrelated to the tests.
sonar.python.coverage.reportPaths=coverage.xml
