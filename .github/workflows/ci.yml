name: CI

# Pushes to master and every pull request. Not both for the same commit: the
# working pattern here is branch -> PR -> merge, so `push` limited to master
# plus `pull_request` covers each commit exactly once.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The model weights, not the wheels. tests/test_embeddings.py runs the
      # real encoder, so without this every run re-downloads it. Keyed on
      # app/embeddings.py because MODELO lives there: changing the model must
      # invalidate the cache, not silently reuse the old weights.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('app/embeddings.py') }}

      # `[embeddings]` pulls torch (~2 GB) and is genuinely needed: four tests
      # in tests/test_embeddings.py assert real semantic separation — that
      # medicine under "Sistema de Registro de Preços" lands far from "sistema
      # de gestão". Those are the tests proving layer 2 does what the README
      # claims, so skipping them when the extra is absent would leave CI
      # green while the claim went unchecked.
      - run: pip install -e ".[dev,embeddings]"

      # No services. The suite runs with no network and no reachable database —
      # verified by running it against a dead Postgres address, not assumed.
      #
      # Coverage is a ratchet, not an aspiration: --cov-fail-under is pinned to
      # what is measured today, so app code arriving without tests turns the
      # build red. Same reasoning as the eval gate below — protect what was
      # achieved rather than gate on a number nobody has reached.
      - run: pytest -q --cov --cov-report=term-missing --cov-fail-under=82

  qualidade:
    name: Qualidade — lint, SAST e dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # No embeddings extra: none of these three tools import the code, they
      # read it. Skipping torch keeps this job under a minute.
      - run: pip install -e ".[dev]"

      # Lint. The rule set is chosen in pyproject.toml, and the deliberate
      # exceptions carry a `noqa` with the reason next to them — a silenced
      # rule with no justification is just a hidden rule.
      - run: ruff check app evals tests

      # SAST. -ll would only report medium and above; the whole point is that
      # this repository reports zero at every severity, so nothing is filtered.
      - run: bandit -r app evals

      # Known CVEs in the dependency tree. This is the check that goes stale on
      # its own — the code does not change for a dependency to become
      # vulnerable, so it runs on every build rather than on every edit.
      - run: pip-audit

  eval:
    name: Eval — gate de regressão
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('app/embeddings.py') }}

      - run: pip install -e ".[dev,embeddings]"

      # No --classificador, so only GRATUITOS run and the job costs nothing.
      # The paid cascade is measured by hand when there is credit; its baseline
      # is recorded in evals/baseline.json all the same, so a later manual run
      # is checked against the same file.
      #
      # The gate is regression, not METAS: recall >= 0.85 is unmet by every
      # classifier (best is cascata_sonnet at 0.846), so gating on the target
      # would open this red on day one and stay that way.
      - run: python -m evals.run --check-baseline
